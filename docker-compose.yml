version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: postgres
    env_file:
      - .env
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - monitoring
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrator:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: go-pet-shop-migrator
    env_file:
      - .env
    environment:
      - APP_ENV=dev
      - DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
    volumes:
      - ./migrations:/app/migrations:ro
    networks:
      - monitoring
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    command: ["./migrator", "--migrations-path", "./migrations"]

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: go-pet-shop
    env_file:
      - .env
    environment:
      - APP_ENV=dev
    ports:
      - "8080:8080"
    networks:
      - monitoring
    depends_on:
      postgres:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    restart: unless-stopped
    command: ["./go-pet-shop"]

volumes:
  postgres_data:

networks:
  monitoring:
    driver: bridge
